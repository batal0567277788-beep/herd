<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجل الماشية</title>
<style>
:root{--bg:#f7f5f0;--card:#fff;--tx:#1f2a22;--mut:#6b756d;--pr:#2f6b3f;--prt:#fff;--bd:#e3dfd5;--wn:#b5651d;--ok:#2f6b3f;--chip:#ebe7dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151a16;--card:#1f2621;--tx:#eaf0ea;--mut:#9aa69c;--pr:#6fbf84;--prt:#10180f;--bd:#2f3a32;--wn:#e0a15a;--ok:#6fbf84;--chip:#2a332c}}
:root[data-theme="dark"]{--bg:#151a16;--card:#1f2621;--tx:#eaf0ea;--mut:#9aa69c;--pr:#6fbf84;--prt:#10180f;--bd:#2f3a32;--wn:#e0a15a;--ok:#6fbf84;--chip:#2a332c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px}
.w{max-width:640px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:20px;margin:6px 0 12px}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.st div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 4px;text-align:center}
.st b{display:block;font-size:20px;color:var(--pr)}.st span{font-size:12px;color:var(--mut)}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:7px 12px;border-radius:999px;border:0;background:var(--chip);cursor:pointer}
.chip.on{background:var(--pr);color:var(--prt)}
.btn{padding:10px 14px;border:0;border-radius:10px;background:var(--pr);color:var(--prt);cursor:pointer;font-weight:600}
.btn.g{background:var(--chip);color:var(--tx)}.btn.r{background:transparent;color:#c0392b;border:1px solid #c0392b}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:8px;overflow:hidden}
.hd{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer}
.num{min-width:44px;height:44px;border-radius:12px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:700}
.inf{flex:1;font-size:14px;color:var(--mut)}.inf b{color:var(--tx);font-size:15px}
.tag{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--chip);margin-inline-start:4px;color:var(--tx)}
.tag.w{background:var(--wn);color:#fff;max-width:none;padding:2px 7px}
.bd{padding:0 12px 12px;border-top:1px solid var(--bd)}
.b{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--bd)}
.b button{background:none;border:0;color:#c0392b;font-size:18px;cursor:pointer}
.sec{margin-top:10px;font-size:13px;color:var(--mut)}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--bg);color:var(--tx);width:min(94vw,520px);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
label.c{display:flex;gap:8px;align-items:center;margin:8px 0}label.c input{width:auto}
</style>
</head>
<body>
<div class="w">
<h1>🐄 سجل الماشية</h1>
<div id="nb" style="display:none;background:var(--wn);color:#fff;padding:10px;border-radius:10px;margin-bottom:10px;font-size:14px">تنبيه: الحفظ التلقائي غير متاح هنا. افتح الملف بمتصفح Chrome من ملفات الجوال، واحفظ نسخة Excel بعد كل تعديل.</div>
<div class="st" id="st"></div>
<div class="row"><input id="q" type="search" placeholder="ابحث برقم الأنثى..."></div>
<div class="chips" id="fl"></div>
<div class="row"><button class="btn" id="add">+ أنثى جديدة</button><button class="btn g" id="imp">استيراد من الجدول</button><button class="btn g" id="exp">نسخ</button><button class="btn" id="xl">💾 حفظ Excel</button><button class="btn g" id="op">📂 فتح ملف Excel</button><input type="file" id="fi" accept=".csv,.txt" hidden></div>
<div id="ls"></div>
</div>

<dialog id="dn"><h3 style="margin-top:0">أنثى جديدة</h3>
<input id="nn" placeholder="رقم الأنثى" inputmode="numeric"><label class="c"><input type="checkbox" id="no"> بكر (من إنتاجي)</label>
<input id="nt" placeholder="ملاحظة (اختياري)">
<div class="row" style="margin-top:12px"><button class="btn" id="ns">حفظ</button><button class="btn g" onclick="dn.close()">إلغاء</button></div></dialog>

<dialog id="di"><h3 style="margin-top:0">استيراد من الجدول</h3>
<p class="sec">انسخ الصفوف من الجدول والصقها هنا. كل سطر أنثى، وتُقرأ الكلمات: بكر، توم (توأم)، وأي نص آخر يصير ملاحظة.</p>
<div class="row"><span>رقم أول سطر:</span><input id="is" type="number" value="1" style="width:90px"></div>
<textarea id="it" rows="8" placeholder="10/28 بكر&#9;8/15&#9;4/11"></textarea>
<div class="row" style="margin-top:12px"><button class="btn" id="ig">استيراد</button><button class="btn g" onclick="di.close()">إلغاء</button></div></dialog>

<script>
var KEY="herd_v1",D=[],F="all",OPEN=null;
try{D=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){D=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
function $(i){return document.getElementById(i)}
function fmt(d){var m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(d);return m?(+m[2])+"/"+(+m[3])+"/"+m[1]:d}
function days(d){if(!/^\d{4}-/.test(d))return null;return Math.floor((Date.now()-new Date(d))/864e5)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){
 var n=D.length,bk=D.filter(function(x){return x.own}).length,rk=D.filter(function(x){return !x.b.length}).length,tb=D.reduce(function(s,x){return s+x.b.length},0);
 $("st").innerHTML=[[n,"الإناث"],[rk,"رخل"],[bk,"بكر"],[tb,"الولادات"]].map(function(a){return"<div><b>"+a[0]+"</b><span>"+a[1]+"</span></div>"}).join("");
 var fs=[["all","الكل"],["rkl","رخل"],["own","بكر"],["tw","لها توأم"],["mul","أكثر من ولادة"]];
 $("fl").innerHTML=fs.map(function(f){return'<button class="chip'+(F==f[0]?" on":"")+'" data-f="'+f[0]+'">'+f[1]+"</button>"}).join("");
 var q=$("q").value.trim();
 var L=D.filter(function(x){
  if(q&&String(x.id).indexOf(q)<0)return false;
  if(F=="rkl")return !x.b.length;if(F=="own")return x.own;
  if(F=="tw")return x.b.some(function(b){return b.t});if(F=="mul")return x.b.length>1;return true});
 if(!L.length){$("ls").innerHTML='<div class="empty">لا توجد نتائج. أضف أنثى أو استورد من الجدول.</div>';return}
 $("ls").innerHTML=L.map(function(x){
  var last=x.b.length?x.b[x.b.length-1].d:null,ds=last?days(last):null;
  var info=x.b.length?"<b>"+x.b.length+" ولادة</b> · آخرها "+esc(fmt(last))+(ds!==null?" (قبل "+ds+" يوم)":""):"<b>لم تلد بعد</b>";
  var h='<div class="card"><div class="hd" data-o="'+x.id+'"><div class="num">'+esc(x.id)+'</div><div class="inf">'+info+'<br>'+(x.own?'<span class="tag">بكر</span>':'')+(!x.b.length?'<span class="tag w">رخل</span>':'')+(x.note?'<span class="tag">'+esc(x.note)+'</span>':'')+'</div><span>'+(OPEN==x.id?"▲":"▼")+'</span></div>';
  if(OPEN==x.id){
   h+='<div class="bd"><div class="sec">الولادات</div>';
   h+=x.b.map(function(b,i){return'<div class="b"><span>'+esc(fmt(b.d))+(b.t?' <span class="tag">توأم</span>':'')+'</span><button data-db="'+x.id+':'+i+'">✕</button></div>'}).join("")||'<div class="sec">لا توجد ولادات</div>';
   h+='<div class="sec">إضافة ولادة</div><div class="row"><input type="date" id="bd'+x.id+'"><label class="c" style="margin:0;white-space:nowrap"><input type="checkbox" id="bt'+x.id+'">توأم</label></div><button class="btn" data-ab="'+x.id+'">+ إضافة ولادة</button>';
   h+='<div class="sec">ملاحظة</div><input id="nt'+x.id+'" value="'+esc(x.note||"")+'" data-nt="'+x.id+'"><label class="c"><input type="checkbox" data-ow="'+x.id+'" '+(x.own?"checked":"")+'> بكر (من إنتاجي)</label>';
   h+='<button class="btn r" data-df="'+x.id+'">حذف الأنثى</button></div>'}
  return h+"</div>"}).join("")}
function get(id){return D.filter(function(x){return String(x.id)==String(id)})[0]}
document.addEventListener("click",function(e){
 var t=e.target.closest("[data-f],[data-o],[data-db],[data-ab],[data-df]");if(!t)return;
 if(t.dataset.f){F=t.dataset.f}
 else if(t.dataset.o){OPEN=OPEN==t.dataset.o?null:t.dataset.o}
 else if(t.dataset.db){var p=t.dataset.db.split(":");get(p[0]).b.splice(+p[1],1);save()}
 else if(t.dataset.ab){var id=t.dataset.ab,v=$("bd"+id).value;if(!v){alert("اختر التاريخ");return}var a=get(id);a.b.push({d:v,t:$("bt"+id).checked});a.b.sort(function(x,y){return /^\d{4}/.test(x.d)&&/^\d{4}/.test(y.d)?(x.d<y.d?-1:1):0});save()}
 else if(t.dataset.df){if(!confirm("حذف الأنثى "+t.dataset.df+"؟"))return;D=D.filter(function(x){return String(x.id)!=t.dataset.df});OPEN=null;save()}
 render()});
document.addEventListener("change",function(e){
 var t=e.target;if(t.dataset.nt){get(t.dataset.nt).note=t.value;save();render()}
 if(t.dataset.ow){get(t.dataset.ow).own=t.checked;save();render()}});
$("q").oninput=render;
$("add").onclick=function(){$("nn").value="";$("no").checked=false;$("nt").value="";dn.showModal()};
$("ns").onclick=function(){var id=$("nn").value.trim();if(!id)return;if(get(id)){alert("الرقم موجود");return}
 D.push({id:id,own:$("no").checked,note:$("nt").value.trim(),b:[]});D.sort(function(a,b){return(+a.id)-(+b.id)});save();dn.close();OPEN=id;render()};
$("imp").onclick=function(){di.showModal()};
function doImport(text,n){
 var lines=text.split("\n"),c=0;
 lines.forEach(function(ln,i){
  var id=String(n+i);if(!ln.trim())return;
  var x=get(id);if(!x){x={id:id,own:false,note:"",b:[]};D.push(x)}
  ln.split(/\t|,|؛|;/).forEach(function(cell){
   var tw=/توم|توأم/.test(cell),dm=cell.match(/\d{1,2}\/\d{1,2}(\/\d{2,4})?/);
   if(/بكر/.test(cell))x.own=true;
   var rest=cell.replace(/بكر|رخل|توم|توأم/g,"").replace(/\d{1,2}\/\d{1,2}(\/\d{2,4})?/,"").trim();
   if(dm){x.b.push({d:dm[0],t:tw})}
   if(rest)x.note=(x.note?x.note+" ":"")+rest});
  c++});
 D.sort(function(a,b){return(+a.id)-(+b.id)});save();return c}
$("ig").onclick=function(){var c=doImport($("it").value,+$("is").value||1);di.close();$("it").value="";render();alert("تم استيراد "+c+" أنثى")};
$("exp").onclick=function(){
 var rows=D.map(function(x){return[x.id,x.own?"بكر":"",x.b.length?"":"رخل",x.note||""].concat(x.b.map(function(b){return fmt(b.d)+(b.t?" توم":"")})).join("\t")}).join("\n");
 var done=function(){alert("تم نسخ البيانات، الصقها في أي جدول")};
 try{navigator.clipboard.writeText(rows).then(done,function(){prompt("انسخ:",rows)})}catch(e){prompt("انسخ:",rows)}};
function qt(v){v=String(v);return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
$("xl").onclick=function(){
 var mx=0;D.forEach(function(x){mx=Math.max(mx,x.b.length)});
 var h=["رقم الأنثى","النوع","ملاحظة","عدد الولادات"];for(var i=1;i<=mx;i++)h.push("ولادة "+i);
 var R=[h].concat(D.map(function(x){return[x.id,x.own?"بكر":(x.b.length?"":"رخل"),x.note||"",x.b.length].concat(x.b.map(function(b){return fmt(b.d)+(b.t?" توم":"")}))}));
 var csv="\ufeff"+R.map(function(r){return r.map(qt).join(",")}).join("\r\n");
 var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
 a.download="سجل_الماشية_"+new Date().toISOString().slice(0,10)+".csv";document.body.appendChild(a);a.click();a.remove()};
function pcsv(t,s){var r=[],row=[],c="",q=false;for(var i=0;i<t.length;i++){var ch=t[i];
 if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
 else if(ch=='"')q=true;else if(ch==s){row.push(c);c=""}
 else if(ch=="\n"){row.push(c);r.push(row);row=[];c=""}else if(ch!="\r")c+=ch}
 if(c||row.length){row.push(c);r.push(row)}return r}
$("op").onclick=function(){$("fi").click()};
$("fi").onchange=function(){var f=this.files[0];if(!f)return;var rd=new FileReader();
 rd.onload=function(){var t=String(rd.result).replace(/^\ufeff/,""),fl=t.split("\n")[0],s=(fl.indexOf(",")<0&&fl.indexOf(";")>=0)?";":(fl.indexOf(",")<0&&fl.indexOf("\t")>=0?"\t":","),c=0;
  pcsv(t,s).forEach(function(r){var id=(r[0]||"").trim();if(!id||isNaN(id))return;
   var x=get(id);if(!x){x={id:id,own:false,note:"",b:[]};D.push(x)}
   x.own=(r[1]||"").indexOf("بكر")>=0;x.note=(r[2]||"").trim();x.b=[];
   for(var k=4;k<r.length;k++){var cell=(r[k]||"").trim();if(!cell)continue;
    var m=cell.match(/(\d{1,2})\/(\d{1,2})(?:\/(\d{4}))?/);if(!m)continue;
    var d=m[3]?m[3]+"-"+("0"+m[1]).slice(-2)+"-"+("0"+m[2]).slice(-2):m[1]+"/"+m[2];
    x.b.push({d:d,t:/توم|توأم/.test(cell)})}c++});
  D.sort(function(a,b){return(+a.id)-(+b.id)});save();render();alert("تم تحميل "+c+" أنثى من الملف")};
 rd.readAsText(f,"utf-8");this.value=""};
var SEED=["رخل","10/28 بكر,8/15,4/11","5/1,12/20,8/3,6/23,1/25","8/9 بكر,7/20,4/19","8/23 بكر,4/23,12/9","3/24 بكر","8/3 بكر,4/20","رخل","رخل","3/15 بكر","رخل","رخل","8/5 بكر","رخل","4/12 بكر","6/26,1/7,8/23,8/2,4/23","رخل","5/15 بكر,1/9,7/17,2/9,9/24,4/29","8/22 بكر,8/25,3/28,10/28,5/5","7/11,5/21,4/21,1/28","7/10 بكر,2/5,9/27","11/3 بكر,7/15,2/24","4/15 بكر","8/29 توم,6/2,12/1,7/27,4/23","12/12 بكر,8/3,4/19,11/10","9/15 بكر,4/22","5/28 بكر,12/25","2/12 بكر,9/6,5/24,1/13","11/11 بكر,6/28,2/7,9/29","12/23 بكر,7/13,2/25,9/17,4/15","7/11 بكر,2/26,9/13","رخل","8/14 بكر","4/6,10/23,7/3,3/4,10/23","6/21,2/12,8/22,4/16,11/30","5/16 بكر,12/20,7/24,4/26","رخل","5/5 بكر,11/28","8/12 بكر,4/21","11/4 بكر","1/4 بكر,9/18","8/10 بكر","7/1 توم,2/24,10/10,5/21,2/14","3/28 بكر","رخل","10/15 بكر,6/5","رخل","4/23 بكر","1/24,8/16,3/20,11/16,7/17,5/17","4/6 بكر","1/19,8/11,3/7,10/1,6/12,1/24","11/13 بكر,8/9","5/6 بكر,1/20,9/11,4/28","10/17 بكر,8/23","10/22 بكر,شك","رخل","2/18 امي,10/17,5/4","4/19 امي","10/3 بكر,5/5","8/3 بكر","رخل","8/4 بكر,5/1,11/7","8/27 بكر,4/5","11/5 بكر","3/17 بكر","7/21,5/18,1/27,10/22","4/21 بكر","10/21 بكر","3/4 بكر","1/5,10/9,6/2,12/26,8/20,4/10","7/9 توم,3/1,11/2,10/17","7/13 بكر,3/18,11/15","4/2 توم,10/19,5/5,11/22,9/16","10/24 بكر,6/28,3/28","5/15,6/19,12/28,9/19,5/16","7/18 بكر,5/3,5/20","6/20,2/22,4/22,11/8","4/6 بكر","رخل","11/5 بكر","8/2 بكر,4/23","10/2 بكر,6/29,3/28","6/29,8/9,3/14,10/28","3/15,10/6,6/10,2/29,10/11"];
try{if(!D.length&&!localStorage.getItem("herd_seeded")){doImport(SEED.join("\n"),13);localStorage.setItem("herd_seeded","1")}}catch(e){if(!D.length)doImport(SEED.join("\n"),13)}
try{localStorage.setItem("_t","1");localStorage.removeItem("_t")}catch(e){$("nb").style.display="block"}
var dn=$("dn"),di=$("di");render();
</script>
</body>
</html>
